name: Gerar APK GR 2026
on:
  workflow_dispatch:
  push:
    paths:
      - 'GR_2026.zip'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair projeto
        run: |
          unzip -q GR_2026.zip -d projeto
          test -f projeto/app/src/main/assets/index.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK
        working-directory: projeto
        run: gradle --no-daemon :app:assembleDebug
      - name: Nomear APK
        run: cp projeto/app/build/outputs/apk/debug/app-debug.apk GR_2026_AAE.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GR_2026_AAE_APK
          path: GR_2026_AAE.apk
          if-no-files-found: error
